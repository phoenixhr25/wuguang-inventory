name: Bug 报告
description: 报告可复现的错误；请勿上传真实照片或备份
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请使用虚构数据复现，不要上传真实物品照片、地址、收纳位置或备份文件。"
  - type: dropdown
    id: environment
    attributes:
      label: 使用环境
      options:
        - 微信 iOS
        - 微信 Android
        - Safari
        - Chrome
        - Edge
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，逐步说明如何看到问题。
      placeholder: "1. 打开……\n2. 点击……\n3. 出现……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 页面地址或版本
      placeholder: https://wuguang-inventory.streamlit.app/
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附上真实照片、完整备份或其他个人信息
          required: true

